aid: 8x8
url: https://raw.githubusercontent.com/api-evangelist/8x8/refs/heads/main/apis.yml
name: 8x8
kind: company
description: '8x8, Inc. is a San Jose, California headquartered cloud communications provider that sells
  an integrated UCaaS, CCaaS and CPaaS platform (marketed as XCaaS) to business buyers in its home market
  of the United States and internationally. In the telecom value chain 8x8 sits in the aggregator half
  of the market, not the mobile network operator half: it does not own radio spectrum, and it resells
  carrier voice and messaging connectivity while adding contact center, unified communications, video
  (it owns and operates Jitsi as a Service) and analytics on top. Its API posture is genuinely developer-first
  for a company of its size — developer.8x8.com is a real self-serve portal, sign-up runs through the
  8x8 Connect console, and the entire documentation site including 34 OpenAPI 3.x definitions is published
  openly on GitHub at 8x8Cloud/public-developer-docs. What 8x8 does not do is the network-API layer: there
  is no CAMARA reference, no GSMA Open Gateway participation, no Aduna channel, no TM Forum Open API conformance
  and no CIBA anywhere in its public developer corpus. 8x8 competes with Twilio, Vonage and Sinch on application-layer
  communications APIs, and buys the underlying network access rather than exposing it.'
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
