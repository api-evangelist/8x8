apis:
- aid: 8x8:8x8-event-streaming
  name: 8x8 Event Streaming API
  description: >-
    Real-time contact center event stream delivered over the Apache Pulsar WebSocket interface. Clients
    connect to wss://{host}/ws/v2/reader/persistent/{tenant}/{namespace}/{topic} on regional 8x8 Pulsar
    proxies (pulsar-ws-euw2, pulsar-ws-use1, pulsar-ws-usw2) and consume agent, call, queue and interaction
    events. Documented with Go, Java, Python, Node.js and browser examples. No AsyncAPI document is published.
  humanURL: https://developer.8x8.com/actions-events/docs/streaming/overview
  tags:
  - Contact Center
  - Event
  - Streaming
  - WebSocket
  - Apache Pulsar
  tags_raw:
  - Contact Center
  - Events
  - Streaming
  - WebSocket
  - Apache Pulsar
  properties:
  - type: Documentation
    url: https://developer.8x8.com/actions-events/docs/streaming/overview
  - type: Documentation
    url: https://developer.8x8.com/actions-events/docs/streaming/connection
    name: Connection Guide
  - type: Webhooks
    url: asyncapi/8x8-events-webhooks.yml
    name: 8x8 event catalogue (31 streaming event types)
  baseURL: wss://pulsar-ws-use1.8x8.com/ws/v2/reader/persistent
- aid: 8x8:jitsi-as-a-service
  name: Jitsi as a Service (JaaS)
  description: >-
    8x8's hosted Jitsi Meet video platform, integrated through the Jitsi IFrame API (commands, events
    and functions) and authorized with RS256-signed JWTs minted from a JaaS API key pair. Mobile SDKs
    are published for Android and iOS. No OpenAPI document is published for JaaS.
  humanURL: https://developer.8x8.com/jaas
  tags:
  - Video
  - Jitsi
  - Meetings
  - WebRTC
  - JWT
