    name: IFrame API Overview
  - type: Authentication
    url: https://developer.8x8.com/jaas/docs/api-keys-jwt
    name: JaaS API Keys and JWT
  baseURL: https://8x8.vc
- aid: 8x8:8x8-cpaas-voice-webhooks
  name: 8x8 CPaaS Voice Webhooks
  description: >-
    Subaccount-level HTTP POST callbacks emitted by the 8x8 CPaaS voice platform: VSS (Voice Session Summary)
    for end-of-session outcomes, VCA (Voice Call Action) for in-call callflow decisions, and VCS (Voice
    Call Status) for real-time call status. Payload schemas are documented per product (IVR, Voice Messaging,
    Number Masking) but are not published as AsyncAPI.
  humanURL: https://developer.8x8.com/connect/docs/voice/webhook-guides/webhooks-overview
  tags:
