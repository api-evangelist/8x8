  status: beta — limited access; API keys cannot be generated in Admin Console, only Beta
    program participants may use these APIs
  source: https://developer.8x8.com/administration/docs/suite-common
- name: Contact Center Campaigns API
  status: beta
  source: https://developer.8x8.com/actions-events/docs/cc-campaigns/overview
