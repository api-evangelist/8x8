source: https://developer.8x8.com/jaas/docs/web-sdk-overview

note: >-
  8x8 ships no first-party server-side SDK for its REST APIs. The Connect/CPaaS, Contact
  Center, Administration and Analytics APIs are documented as plain HTTP with curl /
  Python / Node examples and no published client library on npm, PyPI, Maven Central,
  NuGet, pkg.go.dev, RubyGems, Packagist or crates.io. The client libraries 8x8 does
  publish are all client-side/embedding SDKs, and they come from Jitsi — the open-source
  video project 8x8 owns and operates as Jitsi as a Service (JaaS) — plus the CPaaS
  Voice SDK for mobile. Those are catalogued below and are genuinely first-party to 8x8.

