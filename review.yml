aid: 8x8
name: 8x8
review:
  question: >-
    Does 8x8 operate a real, self-serve public developer portal with downloadable
    OpenAPI, and where does it sit against the telecom sector's CAMARA / GSMA Open
    Gateway network-API standardisation programme?
  answer: true
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: United States
  tier: ucaas-voice
findings:
  summary: |
    8x8 is on the aggregator side of the telecom split, not the operator side, and it
    behaves like it. developer.8x8.com returns HTTP 200 and is a real, ungated,
    self-serve Docusaurus developer portal — no login wall, no "contact sales" gate on
    the documentation. Six product areas are published: CPaaS (Connect), Contact Center
    Actions & Events, Analytics, Administration, Jitsi as a Service (JaaS), and Tech
    Partners. Sign-up for API credentials runs through the 8x8 Connect console at
    https://connect.8x8.com (HTTP 200).

    The whole documentation site is open-sourced at github.com/8x8Cloud/public-developer-docs,
    and that repository carries 34 machine-readable API definitions under docs_oas/.
    All 34 were fetched verbatim on 2026-07-25 (HTTP 200 each from raw.githubusercontent.com)
    and all 34 parse as OpenAPI 3.0.0 / 3.0.1 / 3.1.0 / 3.1.2 with populated paths.
    They are saved in openapi/ with provenance recorded below.

    CAMARA POSTURE — no CAMARA reference found. This is the strongest finding in the
    review and it is a negative one. A full-corpus grep of the cloned public developer
    docs repository (2,342 files, docs/ + docs_oas/) returns ZERO case-insensitive
    matches for "camara", zero for "open gateway"/"opengateway", zero for "sim swap",
    zero for "silent auth"/"flash call", zero for "network exposure function" and zero
    for "network slicing". There is not even a press release to discount: 8x8 does not
    claim CAMARA and does not implement it. 8x8 is not on the GSMA Open Gateway operator
    or channel-partner list found in this review, and no Aduna relationship was evidenced.
    8x8's identity-adjacent products — Verification API (SMS/voice OTP) and Number Lookup
    API (validity, carrier, portability) — are proprietary aggregator products that solve
    problems adjacent to CAMARA Number Verification and Device Status, but they are not
    CAMARA APIs, do not use CAMARA schemas, and do not use CAMARA's OIDC/CIBA
    authorization. 8x8 buys network access; it does not expose it.

    TM FORUM — no TM Forum Open API conformance certification was evidenced, and the
    corpus contains zero mentions of "TM Forum", "tmforum" or any TMF6xx API number.
    8x8 is a cloud communications vendor rather than a BSS/OSS supplier to carriers, so
    the absence is consistent with what the company sells.

    3GPP EXPOSURE — none. No NEF, no SCEF, no 5G network slicing, no edge/MEC API is
    documented anywhere in the corpus.

    AUTH MODEL — three real schemes, all read directly out of the harvested specs.
    (1) HTTP bearer token: every Connect/CPaaS spec (SMS, Business Messaging, Voice,
    Number Masking, Verification, Number Lookup, Contacts, Automation, Configuration).
    (2) apiKey in the x-api-key header: all six Administration specs, the Contact Center
    Chat Gateway, Campaigns, Audit Records and Customer 360. Work Analytics uses an
    8x8-apikey header plus a JWT bearer. (3) OAuth2 client-credentials with a real token
    endpoint, https://api.8x8.com/oauth/v2/token, scopes read/write/admin — used by both
    Analytics for Contact Center specs. Contact Center Call/Agent Status and Dynamic
    Campaigns still use HTTP basic. JaaS uses RS256-signed JWTs minted from a key pair.
    CIBA DOES NOT APPEAR — the single grep hit for "ciba" is a base64 substring inside an
    example token in setagentsstatuses.api.mdx, not Client-Initiated Backchannel
    Authentication. No OpenID Connect either: /.well-known/openid-configuration and
    /.well-known/oauth-authorization-server on api.8x8.com both return HTTP 404.

    WEBHOOKS / EVENTS — real and substantial, but not published as AsyncAPI. CPaaS Voice
    documents three webhook families at the subaccount level: VSS (Voice Session Summary,
    end-of-session outcome), VCA (Voice Call Action, in-call callflow decisions returned
    by the customer's endpoint) and VCS (Voice Call Status, real-time status). Contact
    Center webhooks are created via Configuration Manager or the createwebhook endpoint.
    Separately, 8x8 Event Streaming exposes an Apache Pulsar WebSocket interface at
    wss://{host}/ws/v2/reader/persistent/{tenant}/{namespace}/{topic} on three regional
    proxies (pulsar-ws-euw2, pulsar-ws-use1, pulsar-ws-usw2), superseding a legacy
    Streaming API kept alive behind a backwards-compatible adapter. No AsyncAPI document
    is published for any of it — corpus grep for "asyncapi" returns zero.

    GRAPHQL / gRPC — none. Corpus grep for "graphql" returns zero, and no .proto files
    are published.

    SDKs — 8x8 publishes mobile SDKs, not package-manager SDKs. The Voice SDK is
    documented for Android and iOS (8x8Cloud/voice-sdk-android exists on GitHub), and
    JaaS ships Android and iOS mobile SDKs plus the Jitsi IFrame API. An npm registry
    search surfaced no first-party 8x8 REST client library; @8x8/pui-partner-comm is a
    partner UI package, not an API SDK. Jitsi's own @jitsi/react-sdk and @jitsi/vue-sdk
    are published under the Jitsi (8x8-owned) name on npm.

    POSTMAN — no public 8x8 Postman workspace was evidenced. Postman is referenced only
    incidentally inside three tutorial pages.

    CAVEAT — www.8x8.com itself rate-limits automated requests: every probe of
    https://www.8x8.com/developer, /developers, /api, /opengateway, /products/apis and
    /sitemap.xml returned HTTP 429, with and without a browser user-agent. All portal and
    documentation findings above therefore come from developer.8x8.com (HTTP 200) and from
    the company's own public GitHub documentation repository, which are first-party sources.
  developerPortal:
    url: https://developer.8x8.com/
    httpStatus: 200
    real: true
    gated: false
    note: >-
      Genuine self-serve Docusaurus portal. Documentation is fully readable anonymously;
      credentials require a free 8x8 Connect account. Not a login wall and not a marketing page.
  camara:
    posture: no CAMARA reference found
    apis: []
    openGatewayMember: false
    adunaChannel: false
    pressReleaseOnly: false
    evidence: >-
      Zero case-insensitive matches for "camara", "open gateway", "opengateway", "sim swap",
      "silent auth", "flash call", "network exposure function" or "network slicing" across all
      2,342 files of github.com/8x8Cloud/public-developer-docs (docs/ and docs_oas/), cloned
      2026-07-25. 8x8 does not claim CAMARA and does not implement it.
  tmForum:
    conformanceCertified: false
    evidence: Zero matches for "tm forum", "tmforum" or "TMF6" across the public developer docs corpus.
  threeGPP:
    nefOrScef: false
    networkSlicing: false
    edgeMec: false
  auth:
    schemes:
      - type: http bearer
        note: All 11 Connect/CPaaS specs.
      - type: apiKey
        header: x-api-key
        note: All 6 Administration specs, Chat Gateway, Campaigns, Audit Records, Customer 360.
      - type: apiKey
        header: 8x8-apikey
        note: Work Analytics family, alongside a JWT bearer.
      - type: oauth2 clientCredentials
        tokenUrl: https://api.8x8.com/oauth/v2/token
        scopes: [read, write, admin]
        note: Analytics for Contact Center historical and real-time metrics.
      - type: http basic
        note: Contact Center Call API, Agent Status API, Dynamic Campaigns.
      - type: JWT RS256
        note: Jitsi as a Service, signed with a customer-generated key pair.
    ciba: false
    openIdConnect: false
    wellKnown:
      - url: https://api.8x8.com/.well-known/openid-configuration
        httpStatus: 404
      - url: https://api.8x8.com/.well-known/oauth-authorization-server
        httpStatus: 404
  transports:
    - protocol: REST
      scheme: https
      documented: true
      note: >-
        34 OpenAPI definitions across api.8x8.com, sms.8x8.com, voice.8x8.com,
        chatapps.8x8.com, verify.8x8.com, lookup.8x8.com, contacts.8x8.com,
        automation.8x8.com, video-agent.8x8.com and regional vcc-*.8x8.com hosts.
    - protocol: WebSocket
      scheme: wss
      documented: true
      note: >-
        8x8 Event Streaming over the Apache Pulsar WebSocket proxy;
        wss://{host}/ws/v2/reader/persistent/{tenant}/{namespace}/{topic}.
    - protocol: Webhooks
      scheme: https
      documented: true
      note: VSS, VCA and VCS voice webhooks plus Contact Center chat webhooks. No AsyncAPI published.
    - protocol: GraphQL
      documented: false
    - protocol: gRPC
      documented: false
  sdks:
    - name: 8x8 Voice SDK (Android)
      url: https://developer.8x8.com/connect/docs/voice/voice-sdk/android-integration
    - name: 8x8 Voice SDK (iOS)
      url: https://developer.8x8.com/connect/docs/voice/voice-sdk/ios-integration
    - name: JaaS Mobile SDK (Android / iOS)
      url: https://developer.8x8.com/jaas
    - name: Jitsi IFrame API
      url: https://developer.8x8.com/jaas/docs/iframe-api-overview
  postmanWorkspace: null
