generated: '2026-07-25'
method: searched
source: https://developer.8x8.com/connect/docs/api-error-codes
scope: 8x8 Connect / CPaaS platform-level API error codes (SMS API and Messaging Apps API)
note: 'The non-payments sibling of a decline-code registry: 8x8 Connect returns a numeric `code` in its error envelope
  alongside the HTTP status. Delivery-time failures (after 8x8 hands a message to a supplier) are a separate registry
  — see related_registries.'
envelope:
  fields:
  - field: code
    type: integer
    description: Error code (the registry below).
  - field: message
    type: string
    description: Human-readable error description.
  - field: errorId
    type: uuid
    description: Unique id of the error; use it as the reference when contacting 8x8 support.
  - field: timestamp
    type: string (date-time)
    description: 'Date and time of the error occurrence. Format: yyyy-MM-ddTHH:mm:ss.ffZ'
  example:
    code: 1300
    message: Object wasn't found or is already expired
    errorId: 1cc1eda1-f5dd-ea11-8288-0263195dd35a
    timestamp: '2020-12-22T05:52:01.85Z'
  applies_to: All API responses with HTTP status 400 and above.
http_status_codes:
- status: 200
  meaning: OK — the request has succeeded.
- status: 201
  meaning: Created — the request has succeeded and a new resource has been created.
- status: 202
  meaning: Accepted — the request has been received but not yet acted upon.
- status: 204
  meaning: No Content — succeeded with no response body.
- status: 400
  meaning: Bad Request — request has invalid syntax.
- status: 401
  meaning: Unauthorized — the client must provide the correct API key in the Authorization header.
- status: 403
  meaning: Forbidden — authenticated but without permission for the content.
- status: 404
  meaning: Not Found.
- status: 410
  meaning: Gone — permanently deleted; usually an API version that is no longer supported.
- status: 422
  meaning: Unprocessable Entity — well-formed but semantically invalid.
- status: 426
  meaning: 'Upgrade Required — unsupported TLS version; upgrade to TLS 1.3. Response includes an Upgrade: TLS/1.3
    header.'
- status: 429
  meaning: Too Many Requests — rate limiting.
- status: 500
  meaning: Internal Server Error.
code_classes:
- range: 1000-1099
  class: validation
  meaning: Request parameter validation failures.
- range: '1100'
  class: quota
  meaning: Bulk limit reached.
- range: 1200-1299
  class: authorization
  meaning: Unauthorized access / access forbidden.
- range: 1300-1399
  class: not-found
  meaning: Object not found or expired.
- range: 1400-1499
  class: throttling
  meaning: Resending interval violation.
- range: 2000-2999
  class: server / capability
  meaning: Internal errors, unimplemented functions, unsupported API version or product.
- range: 3000-3999
  class: messaging-apps payload validation
  meaning: Chat Apps / template / channel payload validation (WhatsApp, Viber, Zalo, KakaoTalk, WeChat, Facebook).
