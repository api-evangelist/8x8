        schema:
          type: string
          minLength: 2
          maxLength: 2
      - name: mcc
        in: query
        description: '[Mobile country code](https://en.wikipedia.org/wiki/Mobile_country_code).

          **MCC should always come in pair with MNC parameter.**'
        schema:
          type: integer
      - name: mnc
        in: query
        description: 'Mobile network code.

          **MNC should always come in pair with MCC parameter.**'
        schema:
          type: integer
      - name: direction
        in: query
        description: 'Direction: outbound or inbound.'
        schema:
          type: string
          enum:
          - outbound
          - inbound
