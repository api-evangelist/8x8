      - in: header
        name: Content-Type
        required: true
        schema:
          type: string
          default: application/json
      - in: header
        name: x-token
        required: true
        schema:
          type: string
          default: '{YourAuthToken}'
      - in: query
        name: from
        schema:
          type: string
          format: date
          default: ' yyyy-mm-dd'
      - in: query
        name: to
        schema:
          type: string
          format: date
          default: ' yyyy-mm-dd'
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: cursor
        schema:
          type: string
