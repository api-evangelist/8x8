        data:
          payload:
            umid: 9e09ac86-bd74-5465-851d-1eb5a5fdbb9a
            user:
              channelUserId: test_user_id
              name: test_user_name
            content:
              text: Hello, world!
          accountId: test_account_id
          subAccountId: test_subaccount_id
          triggeredAt: '2021-06-30T03:20:39.3857479Z'
