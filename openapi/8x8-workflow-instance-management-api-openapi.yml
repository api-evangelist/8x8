    definitionNotFoundError:
      value:
        code: 1300
        message: Definition 2aa9465e-dec7-4c3e-8fa6-bd168af9eaca not found.
        errorId: 2558ff83-c8db-4890-805e-ad64001857a1
        timestamp: '2021-07-13T01:28:37.66Z'
