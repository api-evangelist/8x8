  /api/v1/subaccounts/{subAccountId}/messages/batch/{batchId}:
    delete:
      tags:
      - Send Message API
      summary: Cancel batch of scheduled message
      description: '- Sending a DELETE request on this this endpoint allows to **cancel a batch of scheduled messages** that has not been sent yet.

        - This method should be used to cancel a batch of scheduled messages sent by  previously submitting a POST request to either the "many" or "many compact" endpoint.

        - To cancel a batch of scheduled messages, use its *batchId* to target it.


        ### URL

        * In the original POST request used to schedule the batch of messages, you used a specific subaccountid and the API responded with a batchID.

        * You need to use both as path parameters in order to send your DELETE request successfully as shown below:

        `https://chatapps.8x8.com/api/v1/subaccounts/{subAccountId}/messages/batch/{batchId}`


        > You must replace `{subAccountId}` and `{batchId}` in the URL above with the subaccountid you used to schedule the messages in the first place and the batchId you got in response.'
      operationId: cancel-many-chat-apps-messages
      parameters:
      - $ref: '#/paths/~1api~1v1~1subaccounts~1%7BsubAccountId%7D~1lon/parameters/0'
      - name: batchId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelledCount:
                    type: integer
                    description: Number of cancelled messages
              example:
                cancelledCount: 10
        '400':
          $ref: '#/paths/~1api~1v1~1accounts~1%7BaccountId%7D~1webhooks/get/responses/400'
        '401':
          $ref: '#/paths/~1api~1v1~1accounts~1%7BaccountId%7D~1webhooks/get/responses/401'
        '500':
          $ref: '#/paths/~1files~1%7Bfilename%7D/get/responses/500'
      security:
      - apiKey: []
