        description: 'Messaging Apps API: request model for send single message'
      description: 'This endpoint is used to send Messaging Apps messages individually (1 request per message).

        It is ideal to send single personalized messages for use-cases like notifications or alerting for example.


        **For WhatsApp:**

        When sending a ''text'' type message, we will try to match it with registered WhatsApp templates under your account

        If matching is successful, the message will be submitted as a template to WhatsApp, if not as a normal message


        To bypass the template matching and send template only, you can select type ''template''

        In this case, you need to provide template name, language and parameters


        **WhatsApp Call Permission Request:**

        You can request permission to call a customer using either:

        - **Interactive message**: Set type to ''interactive'' with interactive.type as ''call_permission_request''. The body field is optional.

        - **Template message**: Set type to ''template'' with your approved Call Permission Request template name and language.


        **WhatsApp Request Contact Info:**

        You can request a customer to share their contact information using either:

        - **Interactive message**: Set type to ''interactive'' with interactive.type as ''request_contact_info''. The body field is optional.

        - **Template message**: Set type to ''template'' with your approved Request Contact Info template name and language.


        **WhatsApp Business-Scoped User ID (BSUID):**

        You can address a recipient using their `channelUserId` (BSUID) instead of, or alongside, their phone number (`msisdn`). Format: `<COUNTRY-CODE>.<alphanumeric>` where the country code is an uppercase ISO 3166-1 alpha-2 code (e.g. `US.13491208655302741918`). If both are provided, `msisdn` takes precedence.



        More examples on how this endpoint can be used are available here: [Usage examples](/connect/docs/whatsapp/whatsapp-over-8x8-api)'
      security:
      - apiKey: []
  /api/v1/subaccounts/{subAccountId}/messages/batch:
    parameters:
    - $ref: '#/paths/~1api~1v1~1subaccounts~1%7BsubAccountId%7D~1lon/parameters/0'
    post:
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/paths/~1api~1v1~1subaccounts~1%7BsubAccountId%7D~1lon~1batch/post/responses/200/content/application~1json/schema'
              examples:
                response:
                  value:
                    batchId: cf3cbbf5-3e2d-ea11-815d-020897df5459
                    clientBatchId: aaa_batch
                    acceptedCount: 1
                    rejectedCount: 1
                    messages:
                    - umid: d03cbbf5-3e2d-ea11-815d-020897df5459
                      user:
                        msisdn: '+6500000000'
                      clientMessageId: aaa-1
                      status:
                        state: queued
                        timestamp: '2020-01-04T08:19:45.99Z'
                    - umid: 15bb8ad1-d06e-418c-8dc7-ac8a00ffeb70
                      user:
                        msisdn: '+65000001'
                      clientMessageId: aaa-2
                      status:
                        state: rejected
                        timestamp: '2020-01-04T08:19:45.99Z'
                        errorCode: 3038
                        errorMessage: Template not found for provided name and language
        '400':
          $ref: '#/paths/~1api~1v1~1accounts~1%7BaccountId%7D~1webhooks/get/responses/400'
        '401':
          $ref: '#/paths/~1api~1v1~1accounts~1%7BaccountId%7D~1webhooks/get/responses/401'
        '500':
          $ref: '#/paths/~1files~1%7Bfilename%7D/get/responses/500'
      tags:
      - Send Message API
      summary: Send message batch
      description: "* This endpoint is used to send Messaging Apps messages by batches (1 request for multiple messages) with personalized contents/properties. \n* It is ideal to send any kind of massive personalized announcement. \n* Using this API, it is possible to send up to 1,000 messages per request."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                clientBatchId:
                  type: string
                  maxLength: 100
                  example: my-batch-123
                  description: Customer batch ID. This value will be returned in DR "clientBatchId" field
                template:
                  type: object
                  description: 'Specifies general information used for all batch messages.

                    Will be combined will "messages" field to compose final message to be sent.

                    If some property is not present in "messge", it will be taken from "template" object'
                  properties:
                    type:
                      $ref: '#/paths/~1api~1v1~1subaccounts~1%7BsubAccountId%7D~1messages/post/requestBody/content/application~1json/schema/properties/type'
                    content:
                      $ref: '#/paths/~1api~1v1~1subaccounts~1%7BsubAccountId%7D~1messages/post/requestBody/content/application~1json/schema/properties/content'
                    dlrCallbackUrl:
                      type: string
                      format: uri
                      description: Override default DR callback URL for message
                      example: http://example.com
                    channels:
                      type: array
                      description: Override default Channel fallback configuration
                      items: {}
                  title: Batch message template
                messages:
                  type: array
                  description: non-generic information to compose message. Will be combined with "template" properties to compose final message. At least user information should be provided.
                  maxItems: 10000
                  items:
                    $ref: '#/paths/~1api~1v1~1subaccounts~1%7BsubAccountId%7D~1messages/post/requestBody/content/application~1json/schema'
                includeMessagesInResponse:
                  type: boolean
                  default: false
                  example: true
                  description: If 'True', then information about every message will be returned in API response
              required:
              - messages
              description: 'Messaging Apps API: request model for send batch of messages'
              title: Batch message request
        description: 'Messaging Apps API: request model for send batch of messages'
      operationId: send-message-many
      security:
      - apiKey: []
