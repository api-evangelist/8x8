  /v2/pbxes/{pbxId}/sites:
    servers:
    - url: https://api.8x8.com/analytics/work/
    get:
      description: Returns a list of sites of a pbx.
      tags:
      - Sites
      summary: Returns the list of sites of a pbx
      operationId: get-pbx-sites
      parameters:
      - name: pbxId
        in: path
        description: The id of the pbx.
        required: true
        schema:
          type: string
          example: 1UQHOVgWTYCCY6OOk48SAQ
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/size'
      - $ref: '#/components/parameters/sort'
      responses:
        '200':
          description: Returns the list of sites for the specified pbx.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SitesResponsePage'
              example:
                _embedded:
                  siteList:
                  - id: vcXZjfBOT2yWxhUQHzwqwe
                    pbxId: rXp_ceLVQs6RYjUp1Iqqwa
                    name: SanJose
                    deleted: false
                _links:
                  self:
