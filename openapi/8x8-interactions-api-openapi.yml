            |Data|Description|

            |:-|:-|

            |0|Called user |

            |1|Caller|'
          example: 1
        emotion:
          type: string
          description: '

            Detected emotion.


            |Data|

            |:-|

            |Positive|

            |Mostly Positive|

            |Mostly Negative|

            |Negative|

            |Neutral|'
          example: Positive
        gender:
          type: string
          description: '

            Detected person gender.


            |Data|

            |:-|

            |Male|

            |Female|'
          example: male
