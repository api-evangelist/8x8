      - name: Content-Type
        in: header
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: application/json
      responses:
        '200':
          description: OK
        default:
          description: Unexpected error
      deprecated: false
  /interactions/{interactionGuid}/transcriptions:
    get:
      tags:
      - Interactions
      summary: This method queries a single interaction transcription record.
      description: Retrieves available transcriptions for the selected interaction
      operationId: interaction transcription
      parameters:
      - name: interactionGuid
        in: path
        description: The interaction unique identifier
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: int-15bd0b19d21-KK2fSQPPTD3DRpOS8UfhmgALh-phone-03-sample
      - name: Content-Type
        in: header
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                description: Transcription value respone
                items:
                  $ref: '#/components/schemas/transcriptionValueResponse'
              example:
              - text: Good morning.
                confidence: 100
                channel: 1
                emotion: Positive
                gender: male
                timestampStart: 10
                timestampEnd: 11
        default:
          description: Unexpected error
      deprecated: false
  /interactions/{interactionGuid}/topics:
    get:
      tags:
      - Interactions
      summary: Queries a single interaction for matched topics
      description: Retrieves the list of detected topics within the transcriptions
      operationId: topics
      parameters:
      - name: interactionGuid
        in: path
        description: The interaction unique identifier
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: int-15bd0b19d21-KK2fSQPPTD3DRpOS8UfhmgALh-phone-03-sample
      - name: Content-Type
        in: header
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/topic'
              example:
              - channel: 0
                topic: Agent Sales Enablers
                category: Sales
        default:
          description: Unexpected error
      deprecated: false
  /interactions/{interactionGuid}/labels:
    get:
      tags:
      - Interactions
      summary: Query a single interaction attached label
      description: Retrieves the collection of labels attached to the interaction
      operationId: labels
      parameters:
      - name: interactionGuid
        in: path
        description: The interaction unique identifier
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: int-15bd0b19d21-KK2fSQPPTD3DRpOS8UfhmgALh-phone-03-sample
      - name: Content-Type
        in: header
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/labelValue'
              example:
              - text: read this
                createdAt: '2018-03-02T06:14:53'
                updatedAt `2018-03-02T06:14:53`: ''
                links:
                - rel: creator
                  href: https://api.8x8.com/qm/us-west/v1/users/854
                  type: GET
                - rel: updater
                  href: https://api.8x8.com/qm/us-west/v1/users/854
                  type: GET
        default:
          description: Unexpected error
      deprecated: false
  /interactions/{interactionGuid}/notes:
    get:
      tags:
      - Interactions
      summary: Query the attached notes for a single interaction
      description: Retrieve the notes attached to an interaction
      operationId: notes
      parameters:
      - name: interactionGuid
        in: path
        description: The interaction unique identifier
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: int-15bd0b19d21-KK2fSQPPTD3DRpOS8UfhmgALh-phone-03-sample
      - name: Content-Type
        in: header
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/noteValue'
              example:
              - text: read this
                interactionTimestamp: 10
                createdAt: '2018-03-02T06:14:53'
                updatedAt `2018-03-02T06:14:53`: ''
                links:
                - rel: creator
                  href: https://api.8x8.com/qm/us-west/v1/users/854
                  type: GET
        default:
          description: Unexpected error
      deprecated: false
  /interactions/{interactionGuid}/media:
    get:
      tags:
      - Interactions
      summary: The requested interaction media file download
      description: 'Retrieves audio, video, mixed audio (MP3), and video (MP4)

        Transcoding (bit rate, sample rate and channel) options are available for audio files'
      operationId: interaction media file
      parameters:
      - name: interactionGuid
        in: path
        description: The interaction unique identifier
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: int-15bd0b19d21-KK2fSQPPTD3DRpOS8UfhmgALh-phone-03-sample
      - name: Content-Type
        in: header
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: application/json
      - name: bitRate
        in: query
        description: 'The bitrate (kbps)

          |Possible values|

          |:-|

          | `8`,`16`,`24`,`32`,`40`,`48`,`56`,`64`,`80`,`96`,`112`,`128`,`144`,`160`|'
        required: false
        style: form
        explode: true
        schema:
          type: number
          format: double
          example: 48
      - name: sampleRate
        in: query
        description: 'Sample Rates, in Hz.


          |Possible values|

          |:-|

          |`22050`, `24000`, `16000`|'
        required: false
        style: form
        explode: true
        schema:
          type: number
          format: double
          example: 24000
      - name: stereoEnabled
        in: query
        description: If false, the file is a mono, single channel file. If true, the file is in stereo format.
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          example: true
      responses:
        '200':
          description: OK
        default:
          description: Unexpected error
      deprecated: false
  /interactions/redirect:
    get:
      tags:
      - Interactions
      summary: Webpage redirect
      description: Advanced customers can use this method to integrate systems. 8x8 recommends contacting your account representative for more details.
      operationId: webpage redirect
      parameters:
      - name: interactionGuid
        in: query
        description: The interaction unique identifier
        required: true
        style: form
        explode: true
        schema:
          type: string
          example: int-15bd0b19d21-KK2fSQPPTD3DRpOS8UfhmgALh-phone-03-sample
      responses:
        '200':
          description: OK
        default:
          description: Unexpected error
      deprecated: false
components:
  schemas:
    interactionContent:
      description: The interaction object model
      title: Interaction Content
      type: object
      properties:
        createdAt:
          type: string
          description: The datetime when the interaction began
          example: '2018-03-02T07:14:53'
        interactionGuid:
          type: string
          description: The interaction unique identifier
          example: int-15bd0b19d21-KK2fSQPPTD3DRpOS8UfhmgALh-phone-03-sample
        agent:
          $ref: '#/components/schemas/interactionAgent'
        telephony:
          $ref: '#/components/schemas/telephonyDetails'
        media:
          $ref: '#/components/schemas/media'
        customFields:
          $ref: '#/components/schemas/customFieldMap'
        speechAnalysis:
          $ref: '#/components/schemas/speechDetails'
        links:
          type: array
          items:
            $ref: '#/components/schemas/notesLink'
    customFieldMap:
      description: The list of custom fields attached to an interaction object.
      title: customFieldMap
      type: object
      properties:
        customField:
          $ref: '#/components/schemas/customFields'
        customField1:
          $ref: '#/components/schemas/customFields'
        customField2:
          $ref: '#/components/schemas/customFields'
        customField3:
          $ref: '#/components/schemas/customFields'
        customField4:
          $ref: '#/components/schemas/customFields'
        customField5:
          $ref: '#/components/schemas/customFields'
        customField6:
          $ref: '#/components/schemas/customFields'
        customField7:
