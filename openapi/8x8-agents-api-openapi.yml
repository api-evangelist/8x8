openapi: 3.2.0
info:
  title: 8x8 Agents API
  x-refined-note:
  - x-logo differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Agents across 2 of this provider''s published API definitions: 8x8-analytics-8x8-analytics-for-contact-center-real-time-metrics-api.json, 8x8-analytics-work-analytics-customer-data.json. Each path carries the servers of the definition it was published in.'
servers:
- description: Europe Realtime Metrics API Production
  url: https://api.8x8.com/eu/analytics/cc/v5/realtime-metrics
- description: APAC Realtime Metrics API Production
  url: https://api.8x8.com/au/analytics/cc/v5/realtime-metrics
- description: Canada Realtime Metrics API Production
  url: https://api.8x8.com/ca/analytics/cc/v5/realtime-metrics
- description: USA Realtime Metrics API Production
  url: https://api.8x8.com/analytics/cc/v5/realtime-metrics
- url: https://api.8x8.com/analytics/work/
tags:
- name: Agents
  description: This API retrieves realtime metrics related to agents for a given queue or group.
paths:
  /queues/{queueId}/agents:
    servers:
    - description: Europe Realtime Metrics API Production
      url: https://api.8x8.com/eu/analytics/cc/v5/realtime-metrics
    - description: APAC Realtime Metrics API Production
      url: https://api.8x8.com/au/analytics/cc/v5/realtime-metrics
    - description: Canada Realtime Metrics API Production
      url: https://api.8x8.com/ca/analytics/cc/v5/realtime-metrics
    - description: USA Realtime Metrics API Production
      url: https://api.8x8.com/analytics/cc/v5/realtime-metrics
    get:
      security:
      - bearerAuth: []
      tags:
      - Agents
      summary: Agent Statistics by Queue
      description: This method retrieves real-time metrics for a list of agents in a select queue.  By default, all agents from the given queue will be returned. The response can be further filtered and is paginated.
      operationId: cc-real-time-get-agents-metrics-by-queue
      parameters:
      - name: agent-ids
        in: query
        description: The optional set of agent identifiers. Only metrics for selected agents is returned.
        required: false
        allowEmptyValue: false
        explode: true
        schema:
          type: array
          items:
            type: string
          example:
          - ag0001
          - ag0002
      - name: metrics
        in: query
        description: The set of metric identifiers to be returned.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
          example:
          - accepted.int-15m.inQueue
          - accepted.int-30m.inQueue
          - accepted.today.inQueue
          - alerting.rt
          - availableTime.int-15m
          - availableTime.int-30m
          - availableTime.today
          - availableTimePercentage.int-15m
          - availableTimePercentage.int-30m
          - availableTimePercentage.today
          - averageHandlingTime.int-15m.inQueue
          - averageHandlingTime.int-30m.inQueue
