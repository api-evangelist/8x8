        in: query
        description: The page number
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: queueId
        in: path
        description: Returns specific queue agents IDs
        required: true
        schema:
          type: string
        example: '118'
      - name: size
        in: query
        description: The number of individual elements to be returned per page.
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - name: summary
        in: query
        description: This parameter returns the agent summary (id, name) for a specific queue. If this parameter is set to TRUE, agent-ids and metric parameters are ignored.
        required: false
        allowEmptyValue: false
        schema:
          type: boolean
      - name: timezone
        in: query
        description: The specific timezone (applicable for TODAY metrics only)
        required: false
        schema:
          type: string
        example: Europe/Helsinki
      - name: includeTotals
        in: query
        description: Add totals for time, percentage, average and count metric.
        required: false
        allowEmptyValue: false
        schema:
          type: boolean
      responses:
        '200':
          description: Success/OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/SingleQueueResponseXML'
            application/json:
              schema:
                $ref: '#/components/schemas/SingleQueueResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
        '405':
          description: Method not allowed
      deprecated: false
