          - onBreakTimePercentage.int-30m
          - onBreakTimePercentage.today
          - onHoldTime.int-15m.inQueue
          - onHoldTime.int-30m.inQueue
          - onHoldTime.today.inQueue
          - rejectTimeout.int-15m.inQueue
          - rejectTimeout.int-30m.inQueue
          - rejectTimeout.today.inQueue
          - rejected.int-15m.inQueue
          - rejected.int-30m.inQueue
