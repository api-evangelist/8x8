components:
  schemas:
    EventVersion:
      type: string
      enum:
      - v1.0
      - v2.0
      description: Event API version.
      default: v2.0
    WebHookV2Result:
      allOf:
      - type: object
        properties:
          id:
            type: string
            format: string
            description: WebHook identifier.
            example: '12'
          name:
            type: string
            format: string
            maxLength: 255
          uri:
            type: string
            format: uri
            description: Absolute URI.
      - $ref: '#/components/schemas/EventVersionIdentifierField'
    PageResult:
      type: object
      properties:
        page:
          type: object
          properties:
            pageSize:
              type: number
              format: int32
              description: Page size of the response.
            pageIndex:
              type: number
              format: int32
              description: Page 0-based index of the response.
            elementCount:
              type: number
              format: int32
              description: Total number of items.
            pageCount:
              type: number
              format: int32
              description: Total number of pages.
    WebHooksV2ListResult_2:
      allOf:
      - type: object
        properties:
          _embedded:
            type: object
            properties:
              webhooks:
                type: array
                items:
                  $ref: '#/components/schemas/WebHookV2Result'
      - $ref: '#/components/schemas/Links'
      - $ref: '#/components/schemas/PageResult_2'
    WebHooksV2ListResult:
      allOf:
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/WebHookV2Result'
      - $ref: '#/components/schemas/PageResult'
    EventVersionIdentifierField:
      type: object
      properties:
        version:
          $ref: '#/components/schemas/EventVersion'
    WebHookV2VerifyRequest_2:
      allOf:
      - type: object
        required:
        - version
        - uri
        properties:
          version:
            type: string
            format: string
            example: v2.0
            description: The notification version used for testing the URL
          uri:
            type: string
            format: uri
            example: https:/test.8x8.com
            description: The URL to test.
    GenericExceptionPayload:
      type: object
      properties:
        message:
          type: string
          description: Error message.
          example: Internal error.
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                description: Unique error code.
                example: invalid_queue
              message:
                type: string
                description: Free text error description.
                example: Queue ID 112 is invalid.
    ForbiddenViolationProblem:
      type: object
      properties:
        message:
          type: string
          description: Error message.
          example: The tenant does not belong to customer.
        errors:
          type: array
          items:
            type: string
            example: Tenant <<tenantId>> does not belong to customer <<customerId>>.
    InternalServerProblem:
      type: object
      properties:
        message:
          type: string
          description: 'Error message.

            '
          example: Could not process this request due to ...
        errors:
          type: array
          description: List of errors that caused the request to fail.
          items:
            type: string
        referenceId:
          type: string
          description: A referenceId that can be used by 8x8 engineers to track a failed request.
    PageResult_2:
      type: object
      properties:
        page:
          type: object
          properties:
            size:
              type: number
              format: int32
              description: Page size of the response.
            number:
              type: number
              format: int32
              description: Page 0-based index of the response.
            totalElements:
              type: number
              format: int32
              description: Total number of items.
            totalPages:
              type: number
              format: int32
              description: Total number of pages.
    ConstraintViolationProblem:
      type: object
      properties:
        message:
          type: string
          description: The error message.
          example: Constraint Violation
        errors:
          type: array
          items:
            type: string
            example: '<<name>>: May not be empty.'
    ResourceNotFoundProblem:
      type: object
      properties:
        message:
          type: string
          description: Error message.
          example: Resource of type <<resourceType>> with id <<resourceId>> was not found.
        errors:
          type: array
          items:
            type: string
            example: Tenant <<tenantId>> does not belong to customer <<customerId>>.
    WebHookV2PutRequest:
      allOf:
      - type: object
        required:
        - name
        - notificationVersion
        - uri
        properties:
          name:
            type: string
            format: string
            maxLength: 256
          uri:
            type: string
            format: uri
            description: Absolute URI.
      - $ref: '#/components/schemas/EventVersionIdentifierField'
    UnauthorizedProblem:
      type: object
      properties:
        fault:
          type: object
          description: Error message.
          properties:
            faultstring:
              type: string
              example: Invalid Access Token
            detail:
              type: object
              properties:
                errorcode:
                  type: string
                  example: keymanagement.service.invalid_access_token
    WebHookV2VerifyRequest:
      allOf:
      - type: object
        required:
        - version
        - uri
        properties:
          version:
            type: string
            format: string
            example: v2.0
            description: The notification version used for testing the URL
          uri:
            type: string
            format: uri
            example: https://test.8x8.com
            description: The URL to test.
    Links:
      type: object
      properties:
        _links:
          type: object
          properties:
            self:
              type: object
              properties:
                href:
                  type: string
    WebHookV2CreateRequest:
      allOf:
      - type: object
        required:
        - name
        - notificationVersion
        - uri
        properties:
          name:
            type: string
            format: string
            maxLength: 256
          uri:
            type: string
            format: uri
            description: The client URI used to send system events and messages.
      - $ref: '#/components/schemas/EventVersionIdentifierField'
  parameters:
    TenantIdFilterOptional:
      name: X-8x8-Tenant
      in: header
      required: false
      description: Tenant ID, it is going to be mandatory if customer has more than one CC tenant in his organisation.
      schema:
        type: string
        format: string
      example: TheTenant
    SortByOptional:
      name: sort
      in: query
      required: false
      description: Attribute on which sorting direction is applied.
      schema:
        type: string
        default: id:asc
        example: id:asc
    FilterOptional:
      name: filter
      in: query
      required: false
      description: Filter for a query in FIQL format.
      schema:
        type: string
        example: name==Cosmin,(routingOption.id==11)
    WebHookUrlID:
      name: web-hook-id
      in: path
      required: true
      description: WebHook identifier.
      schema:
        type: string
        format: string
        example: '2'
    WebHookUrlID_2:
      name: webhookId
      in: path
      required: true
      description: WebHook identifier.
      schema:
        type: string
        format: string
        example: '2'
    TenantIdPathParam:
      name: tenant-id
      in: path
      description: Tenant ID.
      required: true
      schema:
        type: string
        format: string
      example: TheTenant
    RegionParam:
      name: region
      in: path
      description: Business region to use [e.g., us, eu, ca, ap]
      required: true
      schema:
        type: string
        enum:
        - us
        - eu
        - ca
        - ap
        example: us
        default: us
    NumbericVersionMatchPreconditionOptional:
      name: If-Match
      in: header
      required: false
      description: Entity version tag.
      schema:
        type: number
        format: int32
      example: 1
    PageSizeFilterOptional:
      name: size
      in: query
      required: false
      description: Response page size.
      schema:
        type: number
        format: int32
        default: 20
      example: 100
    PageIndexFilterOptional:
      name: page
      in: query
      required: false
      description: Response page index.
      schema:
        type: number
        format: int32
        default: 0
        example: 1
  responses:
    UnauthorizedResponse:
      description: Contains a description of the error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/UnauthorizedProblem'
    InternalServerErrorResponse:
      description: Contains a description of the error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/InternalServerProblem'
    GeneralErrorResponse:
      description: Contains a description of the error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GenericExceptionPayload'
    ForbiddenRequestResponse:
      description: Contains a descriptive response.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ForbiddenViolationProblem'
    ResourceNotFoundResponse:
      description: Contains a descriptive information.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ResourceNotFoundProblem'
    RequestValidationV2Problem:
      description: Contains a descriptive response for a bad request that is due to data validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ConstraintViolationProblem'
  securitySchemes:
    8x8APIBearerToken:
      type: http
      scheme: bearer
      description: Bearer Token obtained from https://api.8x8.com
    8x8APIBasic:
      type: http
      scheme: basic
      description: Bearer Token obtained from https://api.8x8.com
    8x8ApiKey:
      type: apiKey
      name: x-api-key
      in: header
