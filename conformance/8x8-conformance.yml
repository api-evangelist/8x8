- id: rfc7807-problem-details
  conforms: true
  evidence: The Administration API Suite documents RFC 7807 Problem Details as its error
    format; the two Contact Center Chat OpenAPI documents return application/problem+json
    with UnauthorizedProblem / InternalServerProblem schemas.
- id: rfc9457-problem-details
  conforms: partial
  evidence: RFC 9457 obsoletes RFC 7807; 8x8 cites 7807 explicitly and its envelope omits
    the `type` member, so the payload is 7807-shaped rather than fully 9457-conformant.
- id: rfc7515-jws
  conforms: true
  evidence: Contact Center webhook events are signed with a detached-content, unencoded-payload
    JSON Web Signature per RFC 7515 (x-8x8-signature header).
- id: rfc7519-jwt
  conforms: true
  evidence: Jitsi as a Service authorizes the IFrame API with RS256-signed JWTs minted from
    a JaaS API key pair (https://developer.8x8.com/jaas/docs/api-keys-jwt).
- id: idempotency-key
  conforms: partial
  evidence: An Idempotency-Key (uuid) header parameter is declared in the components of
    both Contact Center Chat OpenAPI documents, but no operation $refs it; webhook
    de-duplication is provided by x-8x8-event-id. See conventions/8x8-conventions.yml.
- id: rsql
  conforms: true
  evidence: The Administration API Suite implements RSQL (github.com/jirutka/rsql-parser)
    as its filter query language, with INVALID_FILTER as the error code.
- id: pagination
  conforms: true
  evidence: Scroll-based pagination (pageSize / scrollId / nextScrollId / hasMore) with
